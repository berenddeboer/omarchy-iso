name: Nightly ISO Build

on:
  schedule:
    - cron: "1 0 * * *" # Daily at 00:01 UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ZFS must bundle its paired runtime, not the published Btrfs-only one.
      - name: Checkout ZFS Omarchy source
        if: github.ref_name == 'quattro-on-zfs'
        uses: actions/checkout@v4
        with:
          repository: berenddeboer/omarchy
          ref: quattro-on-zfs
          path: .build-sources/omarchy
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Omarchy package recipes
        if: github.ref_name == 'quattro-on-zfs'
        uses: actions/checkout@v4
        with:
          repository: omacom-io/omarchy-pkgs
          ref: master
          path: .build-sources/omarchy-pkgs
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Build ISO
        if: github.ref_name != 'quattro-on-zfs'
        run: NO_BOOT_OFFER=1 ./bin/omarchy-iso-make

      - name: Build ZFS ISO from paired source
        if: github.ref_name == 'quattro-on-zfs'
        run: >-
          ./bin/omarchy-iso-make --no-boot-offer --debug
          --local-source "$GITHUB_WORKSPACE/.build-sources/omarchy"
          "$GITHUB_WORKSPACE/.build-sources/omarchy-pkgs"

      - name: Delete previously uploaded ISO artifact
        uses: philips-labs/action-delete-artifacts@v1.0.0
        with:
          workflow: nightly-build.yml
        continue-on-error: true

      - name: Upload newly built ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-iso-${{ github.run_number }}
          path: ./release/*.iso
          retention-days: 1
